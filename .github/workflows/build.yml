name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create --platforms=android --project-name tvremote app
          cp pubspec.yaml app/pubspec.yaml
          cp -r lib/. app/lib/
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&<uses-permission android:name="android.permission.INTERNET"/>|' app/android/app/src/main/AndroidManifest.xml
          cd app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tvremote-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
